<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add a Class</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="icon" href="/images/favicon.ico" type="image/x-icon" />
</head>

<body>
  <header class="site-header">
    <div class="container header-inner">
      <div>
        <h1 class="site-title">Add a Class</h1>
        <p class="site-subtitle">Host your own class for the community!</p>
      </div>
      <nav class="nav">
        <a href="/">Classes</a>
        <a href="/booked.html">Booked</a>
        <a href="/add-Class.html">Add Class</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="panel">
      <form id="addClassForm" class="form">
        <label class="field">
          <span class="label">Title</span>
          <input id="title" name="title" type="text" placeholder="e.g., Kids Martial Arts" required />
        </label>

        <label class="field">
          <span class="label">Description</span>
          <textarea id="description" name="description" rows="4" placeholder="Describe what the class is about..." required></textarea>
        </label>

        <div class="form-actions">
          <button class="button" type="submit">Add Class</button>
          <a class="button secondary" href="/">Cancel</a>
        </div>

        <p id="status" class="muted" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <script src="/js/app.js"></script>
</body>

</html>
